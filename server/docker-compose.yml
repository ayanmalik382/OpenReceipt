version: '3.8'

services:
  backend:
    build: .
    container_name: receiptbook-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/receiptbook.db
      - JWT_SECRET=your_super_secret_key_at_least_32_characters_long
      - AUTH_RATE=20
      - TRUST_PROXY=1
    volumes:
      # Maps your local PC's ./data folder to the container's /data volume
      - ./data:/data
    restart: unless-stopped